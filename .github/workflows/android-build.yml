name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # AGP 8.5.2 + kapt chưa chạy được trên Gradle 9.x của runner -> ghim Gradle 8.9
          gradle-version: "8.9"

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      - name: Tải APK lên làm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
